<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artistic</title>
  <meta name="description" content="Artistic is a community where artists share finished work and works in progress, follow each other, and ask for honest feedback.">
  <meta name="theme-color" content="#F3F3F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C0C11" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Artistic">
  <meta property="og:title" content="Artistic: where artists share the process">
  <meta property="og:description" content="Post your work, follow artists you love, and ask for honest feedback.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..900;1,400..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css"> 
  <script>
    // Apply a saved theme before first paint to avoid a flash of the wrong theme.
    try {
      var t = localStorage.getItem('artistic:theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px;font-family:system-ui,sans-serif">Artistic needs JavaScript turned on to run.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
